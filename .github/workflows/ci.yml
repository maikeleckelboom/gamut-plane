name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Static and unit validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Run unit and component tests
        run: pnpm test

      - name: Verify generated gamut tables
        run: pnpm check:gamut-tables

      - name: Build production application
        run: pnpm build

      - name: Inspect production artifact
        run: pnpm check:build

  browser:
    name: Browser, accessibility, and visual validation
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium and operating-system dependencies
        run: pnpm --filter @gamut-plane/web exec playwright install --with-deps chromium

      - name: Build and inspect production application
        run: |
          pnpm build
          pnpm check:build

      - name: Run browser, accessibility, and visual tests
        run: pnpm test:e2e

      - name: Verify the served production build
        run: pnpm test:production

      - name: Validate packed Vue consumption
        run: pnpm test:package

      - name: Upload Playwright failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
            apps/web/e2e/screenshots/*-linux.png
          if-no-files-found: ignore
          retention-days: 7
